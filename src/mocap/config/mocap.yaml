# z0 的 mocap 节点参数。
#
# ★ 多台无人机复用：**复制这份文件**（如 mocap_z1.yaml），只改 body_name 与几个话题名，代码一行不动：
#     ros2 launch mocap mocap.launch.py params_file:=<那份 yaml> namespace:=z1
#   （yaml 里的 ros__parameters 键 `mocap_rel_pose` 与节点名对应，多机时也**不用改**。）

mocap_rel_pose:
  ros__parameters:
    # ★★ 刚体名是「变量」不是「常量」—— 2026-09-21 一天之内实测到 `Z0`（大写）与 `z0`（小写）两个值。
    #    话题名原样取自 VRPN 的 sender 名（只把空格换成 `_`，**不做大小写归一化**），
    #    所以 Nokov 侧重命名一次，这里就得跟着改。
    #    ⟹ **任何一次配置前先现场核对**：ros2 topic list | grep vrpn
    #    ⟹ 若填错，节点会在 5 s 后把 graph 里实际存在的 /vrpn/*/pose 全列出来（含"只差大小写"的提示）。
    body_name: "z0"
    # 留空 = 由 body_name 推出 "/vrpn/<body_name>/pose"；填了就以此为准（逃生口）。
    input_topic: ""
    # 留空 = 由 body_name 推出 "/vrpn/<body_name>/twist"；填了就以此为准（逃生口）。
    # 速度是**原样转发**（frame = "world"，与 pose 同一个 frame ⟹ 零变换），供 Phase 2 的 MPC 用。
    twist_topic: ""

    # ★★ 动捕外参：**动捕刚体原点 → 飞控 IMU 中心** 的偏移，机体系 **FLU**（x 前 / y 左 / z **上**，m）。
    #    节点在读到的每一帧上都做 `p_imu = p_rb + R(q)·r`（用该帧姿态旋到 ENU），再进原点选择器。
    #
    #    z0 的值：`(0, 0, −0.080)`。
    #      · 为什么 z 是**负**的：IMU 在刚体原点**下方** 80 mm。刚体原点 = 5 个 marker 的
    #        无权重形心（2026-10-09 用 bag 实测证明到小数点后 5 位），marker 分布 114×100×23 mm，
    #        整体在 IMU 上方。
    #      · 出处：2026-10-09 操作者给定 80 mm。同一天由 bag/1_static 的动捕原始 z = +0.10850 m
    #        与"飞控离地约 20 mm"推出的值是 **−0.0885 m**，两者差 8.5 mm（差在"离地 20 mm"是估的）。
    #        两个数都记着；**要改先看 .scratch/phase4/issues/01-geometry-and-extrinsics.md**。
    #      · ⚠️ **每场次/每次装桨后都要复核**：这个数随刚体摆放而变 —— 2026-09-21 那场同一架飞机
    #        读到的原始 z 是 +0.0883（xy 也差了 2–7 mm）。xyz 三个数（尤其 z）不是常量。
    #      · ⚠️ **不要图省事写成"位置固定减 z"**：偏移固连在机体上，飞机一倾斜 IMU 就不在刚体原点
    #        正下方；固定减 z 在 10° 倾角下会留下 80·sin10° ≈ 14 mm 的**水平**误差，且完全静默
    #        （静止/水平飞行看不出来）。代码里用的是带姿态旋转的版本。
    #
    #    ★ 成对纪律：**本节点做了这件事 ⟹ 飞控上 `EKF2_EV_POS_X/Y/Z` 必须保持 `0/0/0`。**
    #      两边各做一次 = 偏移**双计**（错一倍），而且两边都"看起来对"。
    #      填 0/0/0 三个参数 = 关掉外参（节点行为回到改动前）。
    body_to_imu_x: 0.0
    body_to_imu_y: 0.0
    body_to_imu_z: -0.080

    vision_pose_topic: "/mavros/vision_pose/pose"
    pose_enu_topic: "/mocap/pose_enu"
    # Phase 2 的 MPC 速度来源（`geometry_msgs/TwistStamped`，ENU，与 pose_enu 同一个 frame）。
    velocity_enu_topic: "/mocap/velocity_enu"
    state_topic: "/mavros/state"

    # 两阶段的采样帧数。动捕实测 ~196 Hz ⟹ 30 帧 ≈ 0.15 s，60 帧 ≈ 0.3 s（§3.4 的"约 30–120 帧"）。
    boot_samples: 30
    arm_samples: 60

    # 两阶段原点切换量超过它就在日志里告警：说明「启动到解锁之间飞机被移动/转动了」。
    jump_warn_m: 0.05

    # 启动后这么久还没有一帧动捕数据 → 打 ERROR 并列出 graph 里的候选话题。
    no_data_warn_s: 5.0
