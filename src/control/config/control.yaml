# z0 的 control 节点参数。
#
# ★ 多台无人机复用：**复制这份文件**（如 control_z1.yaml），只改话题名与服务名，代码一行不动：
#     ros2 launch control control.launch.py params_file:=<那份 yaml> namespace:=z1
#   （yaml 里的 ros__parameters 键 `control` 与节点名对应，多机时也**不用改**。）

control:
  ros__parameters:
    # —— 控制循环 ——
    # ★ 50 Hz 不是随便定的：切进 OFFBOARD 期间 PX4 要求 setpoint 持续 ≥2 Hz（低于它视为断流），
    #   50 Hz 留了足够余量，且与 PX4 默认的 setpoint 流速率同量级。
    setpoint_rate_hz: 50.0

    # ★ 切 OFFBOARD 之前 setpoint 必须先连续流多久（phase1-implementation.md §4.3-1）。
    #   理由：**断流 PX4 会自动退出 OFFBOARD**（COM_OF_LOSS_T，z0 现值 1.0 s），
    #   所以"先流够了再切"是前提，不是优化。
    offboard_prestream_s: 1.0
    # 切模式失败（PX4 没接受）时的重试间隔；真正的成功判据是 /mavros/state.mode 变成 OFFBOARD。
    offboard_retry_s: 1.0
    # ★ 自动切 OFFBOARD（用户 2026-09-21 裁定）。置 false = 只流 setpoint、不切模式。
    #   台架上想手动 `ros2 service call /mavros/set_mode ...` 观察时改它。
    #   ⚠️ 注意：**真 PX4 只在 OFFBOARD 模式下才读 setpoint_raw** ⟹ 关掉它，飞机不会有任何反应。
    enter_offboard: true

    # ☠️ 这里原本有一个 `yaw` 参数（ticket 05），**ticket 08 删掉了**。
    #   原因：那个参数默认 0，而 0 在 ROS/ENU 口径下经 mavros 换算后是 PX4 的 +90°（机头朝东）
    #   （`setpoint_raw.cpp:231/235`，实测 `yaw_ned = π/2 − yaw_enu`）⟹ 一旦在 OFFBOARD 里解锁，
    #   PX4 会**真的去转机头**。现在 setpoint 的 yaw 一律由状态机给，规则是：
    #     STANDBY / INIT ⟹ **当前机头**（不转向）；进入 TAKEOFF 那一刻锁一次 ⟹ 全程用锁定值。
    #   依据与推导见 `src/control/include/control/fsm.hpp` 的文件头 ★。
    #
    # ☠️ 这里原本还有一个 `own_arming`（ticket 06 的台架临时缝），**ticket 08 也删掉了**：
    #   它把任何 `armed` 上升沿都当作"本节点发起的解锁"，正好会**打掉** §H.6 的"外部解锁"告警。
    #   现在归属由 `Px4Interface::request_arming()` 真实追踪（只有拿到肯定应答之后观察到的
    #   第一个上升沿才算我们的）。

    # 诊断日志周期（INIT 时列出每条输入的话题/静默时长/发布者与 QoS；也用作 /control/state 的心跳）。
    diag_period_s: 1.0

    # —— 话题 / 服务（与 mavros 2.15.1 的默认名一致）——
    state_topic: "/mavros/state"
    local_position_topic: "/mavros/local_position/pose"
    # ★ 速度来源（ticket 08 的稳定判据要它）：EKF2 融合过的速度，比我们自己差动捕干净。
    #   与 local_position **同一条 MAVLink 消息**（mavros 在 `local_position.cpp` 的同一个回调里
    #   发这两个话题）⟹ 频率、时间戳、口径（都是 ROS/ENU，z 向上为正）一致。
    local_velocity_topic: "/mavros/local_position/velocity_local"
    rc_topic: "/mavros/rc/in"
    battery_topic: "/mavros/battery"
    # ★★ ticket 16：**「EKF2 位置失效」唯一可用的载体**（MAVLink ESTIMATOR_STATUS）。
    #   为什么非得是它：`/mavros/local_position/pose` 那条路**根本传不出**位置失效 ——
    #   PX4 的 `EKF2.cpp::PublishLocalPosition` 不合成 NaN，`LOCAL_POSITION_NED` 又把
    #   `xy_valid` 丢掉了，mavros 只是照抄 ⟹ 我们这边的 `position_invalid` 判据在真机上恒假
    #   （第一手证据见 `docs/control/phase1-implementation.md` §4.4）。
    #   而 `estimator_status.solution_status_flags.pos_horiz_abs` 在 PX4 侧就是
    #   `(cs.gps || cs.ev_pos) && _fault_status.value == 0`（`EKF/ekf_helper.cpp:761`），
    #   **每次发布现算** ⟹ 能自清，不是锁存量。
    #   ⚠️ 上游实测 **1.000 Hz**（2026-09-22 z0 读数）—— 这就是下面那条超时取 2.5 s、
    #      以及消抖要按"帧"数而不是秒数的原因。
    #   ⚠️ QoS：真实 mavros 以 `transient_local` 发它，本节点**故意用易失**订阅 ——
    #      durable 订阅会在启动时回放上一会话缓存的 ~10 帧，把"连续为假"的计数当场喂满。
    estimator_status_topic: "/mavros/estimator_status"
    mocap_topic: "/mocap/pose_enu"
    setpoint_topic: "/mavros/setpoint_raw/local"
    set_mode_service: "/mavros/set_mode"
    # ★ 解锁服务（ticket 08）：H.6 的 D3 = **程序解锁**，不靠遥控器拨杆。
    arming_service: "/mavros/cmd/arming"
    control_state_topic: "/control/state"
    # ★ 起飞命令入口（`std_srvs/Trigger`）。用服务而不是话题：命令要**有应答** ——
    #   操作员按了键没反应时，第一个问题永远是"什么缺了"，而那个答案此刻就在手上。
    #   ticket 09 起遥控器 ch9 的上升沿真的接到这里了（状态机本身**不读遥控器**：
    #   边沿由 `rc_switch.hpp` 判、由 `control_node.cpp` 投进 `Fsm::note_start_edge()`）。
    takeoff_service: "/control/takeoff"

    # —— `traj` 的接口（ticket 09；**别的包**的话题，不属于 mavros）——
    #   口径与契约见 `src/traj/README.md` 与 `src/control/include/control/px4_interface.hpp`
    #   的 `Px4Topics`。★ 三件事必须记牢（ticket 07 的 Comments 逐条列过）：
    #     ① `traj_reference_topic` 发的是**相对轨迹原点**的位置 ⟹ 目标 = 轨迹原点 + 它
    #        （直接拿它当目标会让飞机当场俯冲 —— 它的 z 是 0 起步的）；
    #     ② `traj_start_topic` 要**发一次**（进 TRACK 时），运行中重选了轨迹还要**再发一次**
    #        （`select` 会静默停流并清零时钟）—— 重发由状态机按 `traj_stream_gap_s` 的闸门做；
    #     ③ 完成度到 1.0 ⟹ 任务飞完（`TRACK → LAND`）。
    traj_reference_topic: "/traj/reference"
    traj_progress_topic: "/traj/progress"
    traj_start_topic: "/traj/start"
    # ★ 我们**对外提供**的完成度观测面（逐字转发 `/traj/progress`）。
    #   ⚠️ 与 `/traj/progress` 同名不同域：那是 traj 的、这条是我们的。别名会让
    #      "订阅谁"在现场变成一个猜谜（且同一条通道上两个发布者会让 QoS/频率对不上）。
    control_traj_progress_topic: "/control/traj_progress"

    # —— 遥控器**开始键**（ticket 09；§H.1 的裁定值，**别就地改**）——
    # ★ 通道号与阈值的裁定过程（含 §H.4 的 EdgeTX 分配、§H.2 的"ch9 未被任何 `RC_MAP_*` 占用"、
    #   §H.5 的两条边沿语义）都在 `docs/reference/params-changes.md` §H。
    # ★ 这是一档**两位置开关**：第 1 次上升沿 = 解锁起飞、第 2 次 = 开始轨迹；
    #   上电时它若已经停在上位，**不算边沿**（必须先见低位，H.5.2）。
    # ⚠️ 通道号是 **1-based**（与 PX4 的 `RC_MAP_*` 同一约定）⟹ ch9 = `/mavros/rc/in` 的 `channels[8]`。
    #    §H.3 / ticket 09 的验收项 6 仍**未在台架上验过**（EdgeTX 的 CH9 分配 + 遥控链路都不在位），
    #    所以这几个数是"按裁定先落地"，第一次上电时要在 `/mavros/rc/in` 上核一遍。
    start_channel: 9
    # 判"高位"/"低位"的归一化阈值（0.75 ⟹ 1750 µs、0.25 ⟹ 1250 µs，按 1000/2000 折算）。
    start_threshold: 0.75
    release_threshold: 0.25
    # 电平要**连续**保持多久才算数（毫秒）。★ 参数是毫秒、代码里是秒：§H.1 的裁定就是按毫秒说的。
    #   200 ms ⟨ 10 Hz 的帧间隔是 100 ms ⟩ ⟹ 连喂 3 帧才算一次按键（`test_rc_switch.cpp` 钉住了这个）。
    debounce_ms: 200.0
    # 折算的两个端点（µs）。★ **方向由这两个数说了算**，不由名字里的 low/high 说了算：
    #   换一个方向相反的接收机通道，把两个数**对调**即可（不改代码）。
    #   ⚠️ 若哪天把 ch9 也映射进 PX4 用（`RC_MAP_*`），这两个数必须与那边的
    #      `RC9_MIN/MAX/REV`（§H.1：`RC9_REV = 1`）对齐，否则同一条开关在两边含义相反。
    start_low_us: 1000.0
    start_high_us: 2000.0
    # ★ 开始键**长按** ≥ 这么久 ⟹ **立即自动降落**（ticket 07 的增补，2026-09-24 用户裁定）。
    #   它是第四条停任务的入口（前三条见 `operation_manual.md` §1.2）：打杆接管与 ch6 模式开关
    #   都要**交还控制权**，而这一条仍然由程序自主降落、且只需动手上这一把开关。
    #   ⚠️ 计时从**电平被确认**那一刻起算（`debounce_ms` 之后）⟹ 现场"按 1 s"实际要按 ≈ 1.2 s。
    #   ⚠️ 只在**已在飞**的按下上生效：起飞前（未解锁）那一次按下**没有资格**，按着不放不会降落。
    #   `<= 0` = 关掉这条功能（回到 ticket 09 那一版的行为）。
    start_land_hold_s: 1.0

    # —— 每条输入的超时判据 ——
    # ★★ `/mavros/state` 的默认值是 2.5 s，**不要照抄 px4ctrl 的 0.5 s**：
    #    该话题实测 1.000 Hz（min 0.998 / max 1.001），因为 mavros 只在收到 MAVLink HEARTBEAT
    #    时才发布它，而 HEARTBEAT 是 PX4 的 1 Hz 定频流（mavros 侧改不了）。
    #    用 0.5 s 会让这条判据恒真、每秒都在报"飞控失联"。
    #    代价：**解锁上升沿最多晚 1 s 被检出**（对 STANDBY 无影响，ticket 08 起飞前要把这条算进去）。
    state_timeout_s: 2.5
    # 动捕实测 ~196 Hz、local_position 实测 ~30 Hz ⟹ 0.5 s 是"明显漏了"的量级。
    local_pos_timeout_s: 0.5
    mocap_timeout_s: 0.5
    rc_timeout_s: 0.5
    battery_timeout_s: 2.0
    # ★ ticket 16：`/mavros/estimator_status` 实测 1.000 Hz ⟹ 取 2.5 s（2.5 个周期，同 state）。
    #   ⚠️ **它不当判据用** —— 这条话题静默时我们既不能说 EKF2 坏了、也不能说它好
    #   （"不知道"不是"坏消息"，与"没收到电池不是低压"同一条纪律）。它只用两处：
    #     · 诊断里报"这条输入多久没到"；
    #     · `ekf2_pos_lost` 的**新鲜度门** —— 话题静默时不许拿最后一帧的读数说事
    #       （那个读数会一直挂着"假"，而它本该自清）。
    estimator_timeout_s: 2.5

    # —— 失效判据的阈值（ticket 06）——
    # ★ 低电压阈值：**只看电压、不看电流**（ticket 06 明确要求，理由是 01 的 ADC 判定）。
    #   20.0 V ≈ 6S 的 3.33 V/cell，对齐 PX4 自己的低电阈值（`BAT_LOW_THR = 0.15`，
    #   端点 `BAT1_V_CHARGED = 4.2 / BAT1_V_EMPTY = 3.2`）。⚠️ **必须我们来做**：
    #   z0 的 `COM_LOW_BAT_ACT = 0` ⟹ PX4 只警告、不动作。推导与对照写在
    #   `src/control/include/control/px4_interface.hpp` 的 `Limits::low_voltage_v`。
    #   ⚠️ **换电池（4S/5S 都不合用）必须改这里**：4S 满电才 16.8 V ⟹ 会一直误报；
    #      5S 满电 21.0 V ⟹ 才掉到 4.0 V/cell 就报低压（过早）。取小了则保护太晚。
    low_voltage_v: 20.0

    # ★ 摇杆"在动"的判据：**变化率**（µs/s），不是偏移量。
    #   PX4 的 `COM_RC_STICK_OV = 20` 是 0.2/s（归一化摇杆单位），按 z0 实测校准
    #   `RC1_MIN = 989 / RC1_MAX = 2012`（半行程 511 µs）换算 ≈ 102 µs/s，这里取 100。
    #   ⚠️ **改了 PX4 的 `COM_RC_STICK_OV` 就必须同步改这里**，否则节点眼里的"夺权"与
    #      PX4 眼里的"打杆接管"发生在不同时刻（算法与出处见 `src/control/include/control/rc_stick.hpp`）。
    rc_stick_ov_us_per_s: 100.0

    # ★ 动捕**时间戳**连续不前进多久算"冻住"。动捕 ~196 Hz ⟹ 0.5 s ≈ 100 帧，不是抖动。
    #   这条判据管的是话题层看不见的失效：mavros 会丢弃戳不前进的 vision_pose，EKF2 也会丢过旧的样本。
    mocap_stamp_stall_s: 0.5

    # ★★ ticket 16：「EKF2 位置失效」的**消抖帧数** —— `pos_horiz_abs` **连续**为假这么多帧才算成立。
    #   取 2（用户 2026-09-22 裁定）：上游 1 Hz，单帧为假可能只是发布瞬间的抖动，
    #   一帧就降级的代价是"每次抖动都停发 setpoint + 请求降落"。
    #   ⚠️ 它是**帧数**不是秒数 ⟹ 上游频率一变（换固件 / 改 `MAV_*` 流配置）含义就变：
    #      2 帧 = 1 Hz 下的 2 s。
    #   ⚠️ 与另外两条判据的分工（别指望它兜底）：
    #      · `mocap_timeout_s` / `mocap_stamp_stall_s` 0.5 s 就报 ⟹ 那是真兜底；
    #      · 这一条到我们手上要 ~2.5–3 s：EKF2 自己清 `ev_pos` 是 400 ms（样本停了，
    #        `EKF/ev_control.cpp:75`）或 1 s（样本照到、但没被融合，`EKF/ev_pos_control.cpp:256`），
    #        再加**发布相位（1 Hz）+ 这里这两帧消抖**。
    #      · 它值钱的地方是**另一类**失效 —— 帧正常到达、EKF2 却拒绝用（融合失败、
    #        `_fault_status` 非零），那种场面动捕那两条判据完全看不见。
    #   ⚠️ **必须 ≥ 1**：判据是 `streak >= 本值`，而 streak 读到真帧时也是 0 ⟹ 填 0 会让判据**恒成立**。
    #      节点**不钳位**（本仓所有数值参数都在本文件受控、无运行时校验）⟹ 这个坑靠这行注释挡。
    ekf2_pos_lost_samples: 2

    # 四个摇杆通道号（**1-based**，与 PX4 的 `RC_MAP_ROLL/PITCH/THROTTLE/YAW` 同一约定）。
    # ⚠️ 必须与飞控上的 RC_MAP_* 一致，否则我们看的是别的通道（会漏判夺权或误判）。
    rc_map_roll: 1
    rc_map_pitch: 2
    rc_map_throttle: 3
    rc_map_yaw: 4

    # 主动中止任务时请求的模式（mavros `set_mode` 的 `custom_mode`；PX4 的 `AUTO.LAND`）。
    # ⚠️ `AUTO.LAND` 需要 EKF2 有 local position，位置真失效时 PX4 会**拒绝**它 —— 那时
    #    唯一兜底是 PX4 自己的失效保护（`NAV_RCL_ACT` / `COM_OBL_RC_ACT`，见 ticket 06 的保留说明）。
    land_mode: "AUTO.LAND"

    # —— 任务判据的阈值（ticket 08）——
    # ★ 与上面那组**失效判据**（`Limits`）分开：那一组管"什么时候停"，这一组管"飞到什么算到"。
    #   两者的默认值就是工单里的数（`fsm.hpp::TaskLimits`），这里逐条抄下来只为可调。

    # 起飞目标高度（m，相对**起飞原点**）。
    takeoff_altitude_m: 1.0
    # ★ 工单硬要求：**≤ 0.5 m/s**（`docs/control/phase1-implementation.md` 的两阶段路线里，
    #   第一级自由飞只许垂直慢爬）。这不是"性能参数"，改大直接违反验收项。
    climb_speed_mps: 0.5
    # 到高判据：`|z − (起飞原点+高度)| < tol ∧ |v_z| < tol` **持续** takeoff_settle_s。
    takeoff_alt_tol_m: 0.10
    takeoff_vel_tol_mps: 0.10
    takeoff_settle_s: 1.0
    # ★★ 稳定判据（工单原文）：`位置误差 < 0.10 m ∧ |v| < 0.10 m/s 持续 2 s`。
    #   位置误差相对的是**悬停点**（= 起飞原点正上方 takeoff_altitude_m），
    #   不是轨迹原点 —— 轨迹原点恰恰是**判稳那一刻**才记下来的，拿它当基准是循环定义。
    #   ⚠️ 速率来自 `local_velocity_topic`（EKF2 融合值，三维），不是"z 轴速度"。
    hover_pos_tol_m: 0.10
    hover_vel_tol_mps: 0.10
    hover_settle_s: 2.0
    # ★★ ticket 09 **取代**了 ticket 08 的 `hover_hold_s`（那条参数已不存在）：
    #   降落不再由"在轨迹原点上停了多久"触发，而是由**开始键**（进 TRACK）或**轨迹跑完**触发。
    #   但"操作员一直不按键"这条自己走不出去的态必须有个兜底 ⟹ 那个数现在叫这个。
    #   ★ `<= 0` = **永不超时**（飞机一直停在轨迹原点上等按键）。
    # ★ 取 300 s 的理由：它是"兜底"不是"功能" —— 正常流程是按键进 TRACK；
    #   而这个值要长到"够操作员处理完任何现场状况"（看日志、找遥控器、确认空域），
    #   又要短到"万一操作员已经走了，飞机不会一直悬着"。5 分钟两者都够。
    # ⚠️ 自由飞（阶梯第 4 级）的验收项是"60 s 手不离杆" ⟹ 若改成 < 30 s，
    #   飞机会在验收时长走完之前自己下来（节点启动时会为此发一条 WARN）。
    wait_start_timeout_s: 300.0

    # ★★ ticket 09：`TRACK` 的两条时限。**改之前先读 `fsm.hpp::TaskLimits` 上那两段说明** ——
    #   这两个数与 `traj` 的发布行为强耦合（50 Hz 的流；`select` 会**静默**停流并清零时钟）。

    # 参考流断了多久才**重发一次** `/traj/start`（s）。
    #   取 0.5 s = 连丢 25 帧（50 Hz）⟹ 抖动不会触发它。
    #   ⚠️ **不许调小**：重发会让 `traj` 把参考时钟归零，而它若其实还在跑，飞机就当场掉头飞回起点。
    #      0.5 s 是"确实断了"，不是"好像慢了"。
    traj_stream_gap_s: 0.5

    # 参考流断了多久判 `degrade=traj_timeout`（s）⟹ 停发 + 请求降落（**已解锁时才算失效**）。
    #   必须**大于**上面那个闸门（够重发一次并等它回来），见 `fsm.hpp::TaskLimits`。
    traj_timeout_s: 3.0

    # 起飞命令的兜底超时：受理之后这么久还没解锁（前置不齐 / 被拒 / 没应答）⟹ 命令作废、
    # 退回 STANDBY。**不自动重试**是刻意的（用户 2026-09-22 裁定）——
    # 静默重试会把"解锁参数没配对"这种确定性拒绝变成一串没人看的日志。
    takeoff_timeout_s: 5.0
