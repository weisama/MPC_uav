# 台架夹具的默认参数 —— 与 `bench/config.py` 的 DEFAULTS 一一对应（改一处要同时改另一处）。
#
# ★ 这份 yaml 是**真的被读**的：`Scenario()` 默认会加载它，yaml 里只写要改的键（与 DEFAULTS 深合并）。
#   不传 `config_file=` 且安装目录里找不到它时，回落到代码里的 DEFAULTS（两者内容相同）。
#
# ★★ 频率这一栏不是"好测就行"，是**照抄真 mavros 的实测值**：
#    把 state 调快会让"解锁上升沿最多晚 1 s"这类真问题在测试里消失 —— 那等于用夹具说谎。

rates_hz:
  # 实测 1.000 Hz（min 0.998 / max 1.001）。根源：mavros 只在收到 MAVLink HEARTBEAT 时
  # 才发这个话题，而 HEARTBEAT 是 PX4 的 1 Hz 定频流 ⟹ 改不了、也不该在夹具里改。
  state: 1.0
  local_position: 30.0      # mavros 的 local_position 插件（实测 ~30 Hz）
  local_velocity: 30.0
  rc: 10.0
  battery: 1.0
  # ticket 16：MAVLink ESTIMATOR_STATUS，实测 1.000 Hz（2026-09-22 z0 读数）。
  # ⚠️ 与 DUT 的 ekf2_pos_lost_samples（**帧数**）是一对：1 Hz 下 2 帧 = 2 s。
  estimator_status: 1.0
  # 动捕实测 190.9–197.0 Hz（ticket 12 的读数）
  vrpn: 200.0

# 话题名与 mavros 2.15.1 的默认名一致。★ 夹具**按真名发**，不按"测试方便"改名 ——
# 改名会让 DUT 里写错的默认值照样通过测试。
topics:
  state: "/mavros/state"
  local_position: "/mavros/local_position/pose"
  local_velocity: "/mavros/local_position/velocity_local"
  rc: "/mavros/rc/in"
  battery: "/mavros/battery"
  # ticket 16：EKF2 位置失效的载体（唯一一个在本链条上真能读到的，见 phase1-implementation.md §4.4）。
  estimator_status: "/mavros/estimator_status"
  setpoint: "/mavros/setpoint_raw/local"
  set_mode: "/mavros/set_mode"
  arming: "/mavros/cmd/arming"

initial:
  # 假 EKF 的位置（**ROS/ENU，z 向上为正** —— 它进的是 /mavros/local_position/pose）。
  # 默认在原点；要辨认坐标轴时由测试显式 set_position。
  position: [0.0, 0.0, 0.0]
  connected: true
  armed: false
  # POSCTL：真机上"上电后、切 OFFBOARD 之前"的常见模式。
  mode: "POSCTL"
  # 6S 满电附近。★ 必须**明显高于** DUT 的 low_voltage_v（默认 20.0 V）：否则每个用到
  # armed 的场景都会立刻降级到停发/AUTO.LAND，而"低压"是那些测试没打算注入的东西。
  voltage: 25.0

mocap:
  # 'mocap' = 直接发 /mocap/pose_enu（测 control 时用，旁路 mocap 节点）
  # 'vrpn'  = 发 /vrpn/<刚体>/pose（测 mocap 节点、或测整链时用）
  target: "mocap"
  body_name: "z0"
  position: [0.0, 0.0, 0.0]

scenario:
  # 起夹具时是否同时起 DUT（False = 只要夹具，"我想先看看假 mavros 自己发的对不对"时用）
  start_dut: true
  # 要不要起脚本化动捕源（测的节点不依赖动捕时可以关掉）
  mocap: true
  # ★ 要不要起**假 PX4**（Phase 2 走 uXRCE-DDS 的 `/fmu/*` 那一半）。默认关：
  #   Phase 1 的 (A) 链不需要它。⚠️ 它与假 mavros 互不干扰（不同话题族），可以同时开。
  px4: false

# 假 PX4 的初始状态与话题名（对应 `bench/config.py` 的 DEFAULTS["px4"]）。
px4:
  # 默认"上电后、切 OFFBOARD 之前"的样子：未解锁 + POSCTL。
  armed: false
  nav_state: 2          # 2 = POSCTL（VehicleStatus.msg 的 NAVIGATION_STATE_POSCTL）
  pre_flight_checks_pass: true
  # 话题名照抄 PX4 的 uXRCE-DDS 命名，不要为了"测试方便"改名 ——
  # 改名会让 DUT 里写错的默认值照样通过测试。
  topics:
    status: "/fmu/out/vehicle_status"
    rates: "/fmu/in/vehicle_rates_setpoint"
    mode: "/fmu/in/offboard_control_mode"
